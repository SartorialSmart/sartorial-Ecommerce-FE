name: Build and Deploy Frontend

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: https://sartorialsmart.com/api/v1
      VITE_TENANT_SLUG: ${{ secrets.VITE_TENANT_SLUG }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'prime' }}
      FE_APP_DIR: ${{ vars.FE_APP_DIR || '/home/prime/sartorial-Ecommerce-FE' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Validate build-time environment
        run: |
          test -n "$VITE_API_BASE_URL" || { echo "::error::VITE_API_BASE_URL secret is required"; exit 1; }
          case "$VITE_API_BASE_URL" in
            */api/v1) ;;
            *) echo "::error::VITE_API_BASE_URL must end with /api/v1"; exit 1 ;;
          esac

      - name: Build Nitro node output
        run: bun run build

      - name: Prepare remote directory
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: FE_APP_DIR
          script: |
            mkdir -p "$FE_APP_DIR"
            rm -rf "$FE_APP_DIR/.output"

      - name: Copy .output/ to DigitalOcean Droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: ".output"
          target: ${{ env.FE_APP_DIR }}
          overwrite: true

      - name: Restart frontend service
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: sudo systemctl restart sartorial-ecommerce-fe && sudo systemctl is-active sartorial-ecommerce-fe
