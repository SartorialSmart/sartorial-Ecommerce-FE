# SartorialEcommerce frontend — replace shop.example.com with your storefront domain.
# certbot --nginx -d shop.example.com adds the HTTPS block and HTTP -> HTTPS redirect.

upstream sartorialecommerce_fe {
    server 127.0.0.1:3000;
}

server {
    listen 80;
    listen [::]:80;
    server_name shop.example.com;

    client_max_body_size 20M;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Nitro serves both the SSR responses and the hashed /assets files.
    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_pass http://sartorialecommerce_fe;
    }
}
